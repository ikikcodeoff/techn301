<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Techn301 — Codes</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<div class="wrap">

      <h1>Techn301 — Vie Scolaire</h1>
      <div class="sub">Codes provisoires</div>

    <div class="pill">

<section class="glass section">

    </div>
  </div></div>

  <div class="small" style="margin-top:12px; opacity:.75; text-align:center">
