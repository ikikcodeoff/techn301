<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Techn301 — Notes</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="noise"></div>
<div class="wrap">
  <header>
    <div class="title">
      <h1>Techn301 — Vie Scolaire</h1>
      <div class="sub">Évals & devoirs</div>
    </div>
    <div class="pill">
      <span>👤</span>
      <span><b id="who">Déconnecté</b></span>
      <span class="small" id="roleTxt">—</span>
      <span class="small">•</span>
      <span class="small" id="modeTxt">—</span>
    </div>
  </header>

  <div class="card"><div class="inner">
    <div class="row" style="margin-top:0">
      <div class="nav" id="nav"></div>
      <div class="btns">
        <button id="btnLogout">Se déconnecter</button>
        <span class="tag" id="statusTag">📝 Prêt</span>
      </div>
    </div>

    <div class="grid" style="margin-top:14px">
      
<section class="glass section">
  <h2>📝 Notes (Évals / Devoirs)</h2>
  <p class="desc">Créer une note (brouillon). Publier = visible élève.</p>

  <div class="split">
    <div>
      <div class="small">Élève</div>
      <select id="gStudent"><option value="">— Choisir —</option></select>

      <div class="cols2" style="margin-top:10px">
        <div>
          <div class="small">Type</div>
          <select id="gKind">
            <option value="eval">Éval</option>
            <option value="devoir">Devoir</option>
          </select>
        </div>
        <div>
          <div class="small">Titre</div>
          <input id="gTitle" placeholder="ex: Contrôle Chapitre 2">
        </div>
      </div>

      <div class="cols2" style="margin-top:10px">
        <div>
          <div class="small">Note</div>
          <input id="gScore" placeholder="ex: 14" inputmode="decimal">
        </div>
        <div>
          <div class="small">/ Sur</div>
          <input id="gOutOf" value="20" inputmode="decimal">
        </div>
      </div>

      <div class="row">
        <div class="btns">
          <button class="primary" id="btnGradeAdd">Créer</button>
          <button id="btnGradesLoad">Voir notes</button>
        </div>
        <span class="tag">Brouillon → Publier</span>
      </div>
    </div>

    <div>
      <div class="list" id="gradesList"></div>
    </div>
  </div>
</section>

    </div>
  </div></div>

  <div class="small" style="margin-top:12px; opacity:.75; text-align:center">
    TECHN301 — Prototype Techno • Multi-pages • GitHub Pages
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/app.js"></script>
<script>
  T301.initCommon("notes");
  T301.pageNotes();
</script>
</body>
</html>
